
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Send BiteBox Grill an enquiry about our meals, prices and services in Johannesburg and Soweto.">

    <meta name="keywords" content="BiteBox Grill, food enquiry, fast food, meal prices, Johannesburg, Soweto">

    <title>Make an Enquiry | BiteBox Grill</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website header -->
    <header>

        <img src="images/logo.png" alt="BiteBox Grill logo">

        <!-- Mobile navigation button -->
        <button class="menu-toggle" id="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="main-nav">
            ☰
        </button>

        <!-- Navigation menu -->
        <nav id="main-nav">

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Menu</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>

        </nav>

    </header>


    <!-- Main content -->
    <main>

        <!-- Introduction -->
        <section class="enquiry-intro">

            <h1>Make an Enquiry</h1>

            <p>
                Have a question about our meals or services?
                Complete the form below and we will get back to you.
            </p>

        </section>


        <!-- Enquiry form -->
        <section class="enquiry-form">

            <h2>Customer Enquiry</h2>

            <form id="enquiry-form">

                <label for="name">Full Name</label>

                <input type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                    minlength="2">


                <label for="email">Email Address</label>

                <input type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>


                <label for="phone">Phone Number</label>

                <input type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                    pattern="[0-9+\s()-]{7,20}"
                    title="Enter a valid phone number using numbers, spaces, brackets or a plus sign.">


                <label for="product">Select a Meal</label>

                <select id="product" name="product" required>

                    <option value="">-- Choose a meal --</option>
                    <option value="Beef Burger">Beef Burger - R55</option>
                    <option value="Chicken Wrap">Chicken Wrap - R50</option>
                    <option value="Chips">Chips - R30</option>
                    <option value="Chicken and Chips">Chicken and Chips - R65</option>
                    <option value="Family Meal">Family Meal - R150</option>
                    <option value="Grilled Meal">Grilled Meal - R70</option>

                </select>


                <label for="subject">Subject</label>

                <input type="text"
                    id="subject"
                    name="subject"
                    placeholder="What is your enquiry about?"
                    required>


                <label for="message">Message</label>

                <textarea id="message"
                    name="message"
                    rows="6"
                    placeholder="Type your enquiry here"
                    required
                    minlength="5"></textarea>


                <button type="submit">Submit Enquiry</button>

            </form>

            <!-- Form response message -->
            <p id="enquiry-response" aria-live="polite"></p>

        </section>

    </main>


    <!-- Website footer -->
    <footer>

        <p>BiteBox Grill - Fresh, Fast and Local.</p>

        <p>Johannesburg and Soweto</p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
