<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox Grill - Enquiry</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Website header -->
    <header>

        <img src="images/logo.png" alt="BiteBox Grill logo">

        <!-- Navigation menu -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Menu</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <!-- Main content -->
    <main>

        <section class="enquiry-intro">

            <h2>Make an Enquiry</h2>

            <p>
                Have a question about our meals or services?
                Complete the form below and we will get back to you.
            </p>

        </section>

        <!-- Enquiry form -->
        <section class="enquiry-form">

            <h2>Customer Enquiry</h2>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="What is your enquiry about?">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"
                    placeholder="Type your enquiry here"></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>

    <!-- Website footer -->
    <footer>

        <p>
            BiteBox Grill - Fresh, Fast and Local.
        </p>

        <p>
            Johannesburg and Soweto
        </p>

    </footer>

</body>

</html>
